<section id="filters-section" class="filter-panel" aria-label="Filtros de la vista"><div class="filter-heading"><div><span class="eyebrow">FILTROS</span><p id="filter-description">Selección de noticias y período de consulta.</p></div></div>
<section class="reading-context" hidden id="reading-context" aria-label="Contexto de lectura"><div><p class="eyebrow" id="reading-title">Actualidad del sector</p><p class="small muted" id="reading-detail"></p></div><div class="actions"><label id="reading-choice">Mi selección<select id="reading-preference"><option value="default">Selección predeterminada</option></select></label><button type="button" class="button" id="reading-current" hidden>Volver a la actualidad</button></div></section>
<form id="filters"><div class="filter-primary"><label>Entidad<select name="entity"><option value="">Todas</option></select></label><label>Segmento<select name="segment"><option value="">Todos</option></select></label><label id="geography-filter">Geografía<select name="country"><option value="">Todos</option></select></label><label id="coverage-filter">Cobertura<select name="coverage"><option value="">Todos</option><option value="generalista">Generalista</option><option value="digital">Canal digital</option></select></label><button class="button filter-reset" type="reset">Ver todo ↗</button></div><details id="advanced-filters" class="advanced-filters"><summary>Más filtros <span>Tipo, novedad, tema, medio y fechas</span></summary><div class="filter-advanced"><label>Buscar<input name="search" type="search" placeholder="Titular, entidad o palabra clave" maxlength="160"></label><label>Palanca<select name="palanca"><option value="">Todas</option></select></label><label>Subpalanca<select name="subpalanca"><option value="">Todas</option></select></label><label>Tema<select name="topic"><option value="">Todos</option></select></label><label>Tipo de entidad<select name="type"><option value="">Todos</option></select></label><label>Novedad<select name="signal"><option value="">Todas</option></select></label><label>Medio<select name="source"><option value="">Todos</option></select></label><label id="from-filter">Desde<input name="from" type="date"></label><label id="to-filter">Hasta<input name="to" type="date"></label></div></details></form></section>
