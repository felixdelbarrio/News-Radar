    "Equivalencias y conceptos emergentes de News Radar. Los c\xF3digos, nombres y descripciones oficiales se leen del maestro de Drive y no se editan aqu\xED. Los productos concretos admiten una fuente oficial; las tendencias requieren tres noticias y dos medios.": ["News Radar aliases and emerging concepts. Official codes, names and descriptions are read from the Drive master and cannot be edited here. Specific products can use one official source; trends require three articles and two publishers.", "News Radar e\u015Fde\u011Ferleri ve yeni kavramlar\u0131. Resm\xEE kodlar, adlar ve a\xE7\u0131klamalar Drive ana katalo\u011Fundan okunur ve burada d\xFCzenlenmez. Somut \xFCr\xFCnler i\xE7in bir resm\xEE kaynak yeterlidir; e\u011Filimler \xFC\xE7 haber ve iki yay\u0131nc\u0131 gerektirir."],

    "El maestro debe ser un documento distinto del libro de News Radar.": ["The master must be a different document from the News Radar workbook.", "Ana katalog, News Radar \xE7al\u0131\u015Fma kitab\u0131ndan farkl\u0131 bir belge olmal\u0131d\u0131r."],

    "Se requiere una capacidad activa y contexto empresarial o una capacidad transversal \xFAtil para empresas. Canal y servicio aportan evidencia; las exclusiones se buscan en el titular. Retail solo se excluye cuando falta contexto empresarial. Las se\xF1ales de cambio proceden de Novedades y lanzamientos. T\xE9rminos separados por punto y coma; * al final de una palabra admite sus variantes. \xC1mbito de aplicaci\xF3n prioriza los pa\xEDses y agrupa el resto como referencia internacional.": ["An active capability and business context or a reusable business capability are required. Channel and service provide evidence; exclusions apply to headlines. Retail is excluded only without business context. Change signals come from News and launches. Separate terms with semicolons; a trailing * matches word variants. Application scope prioritizes countries and groups the rest as an international reference.", "Etkin bir yetenek ve i\u015F ba\u011Flam\u0131 veya i\u015Fletmelerce kullan\u0131labilen bir yetenek gereklidir. Kanal ve hizmet kan\u0131t sa\u011Flar; hari\xE7 tutmalar ba\u015Fl\u0131kta aran\u0131r. Bireysel i\xE7erik yaln\u0131zca i\u015F ba\u011Flam\u0131 yoksa hari\xE7 tutulur. De\u011Fi\u015Fim i\u015Faretleri Yenilikler ve lansmanlardan gelir. Terimleri noktal\u0131 virg\xFClle ay\u0131r\u0131n; s\xF6zc\xFCk sonundaki * t\xFCrevleri e\u015Fle\u015Ftirir. Uygulama kapsam\u0131 \xFClkelere \xF6ncelik verir, kalan\u0131n\u0131 uluslararas\u0131 referans olarak gruplar."],
    "Vocabulario editable de recuperaci\xF3n. Los primeros cuatro t\xE9rminos tienen prioridad en las b\xFAsquedas del idioma; se combinan con Operaci\xF3n y selecci\xF3n inicial y Capacidades digitales. Editar estas listas cambia las pr\xF3ximas consultas sin a\xF1adir fuentes ni multiplicar combinaciones.": ["Editable retrieval vocabulary. The first four terms have priority in searches in that language; they combine with Operation and initial selection and Digital capabilities. Editing these lists changes future queries without adding sources or multiplying combinations.", "D\xFCzenlenebilir haber toplama s\xF6zl\xFC\u011F\xFC. \u0130lk d\xF6rt terim ilgili dilde \xF6nceliklidir; \u0130\u015Fletim ve ba\u015Flang\u0131\xE7 se\xE7imi ile Dijital yeteneklerle birle\u015Ftirilir. Bu listeleri d\xFCzenlemek kaynak eklemeden veya kombinasyonlar\u0131 \xE7o\u011Faltmadan gelecekteki sorgular\u0131 de\u011Fi\u015Ftirir."],
