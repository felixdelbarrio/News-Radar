  // src/shared/visual-identity.js
  var publisherIdentities = /* @__PURE__ */ new Map();
  function identityMark(kind, name, escape2, images) {
    if (kind === "publishers" && !publisherIdentities.size) for (let [name2, asset2] of Object.entries(define_IDENTITY_ASSETS_default.publishers)) publisherIdentities.set(name2.toLowerCase().trim(), asset2);
    let asset = kind === "publishers" ? publisherIdentities.get(String(name || "").toLowerCase().trim()) : define_IDENTITY_ASSETS_default[kind]?.[name];
    if (!asset) return kind === "entities" && name ? '<span class="entity-monogram" title="' + escape2(name) + '" aria-label="' + escape2(name) + '">' + escape2(name.split(/\s+/).map((word) => word[0]).join("").slice(0, 2)) + "</span>" : "";
    images && images.set(asset.id, asset);
    let src = images ? "cid:" + asset.id : "data:image/png;base64," + asset.data;
    return '<img class="' + (kind === "countries" ? "geography-flag" : kind === "publishers" ? "publisher-logo" : "entity-logo") + '" src="' + src + '" width="' + asset.width + '" height="' + asset.height + '" alt="' + escape2(name) + '" title="' + escape2(name) + '"' + (images ? "" : ' loading="lazy" decoding="async"') + ">";
  }
  function storyIdentity(entity, country, escape2, images) {
    let marks = identityMark("entities", entity, escape2, images) + identityMark("countries", country, escape2, images);
    return marks ? '<span class="story-identity">' + marks + "</span>" : "";
  }

  // src/shared/taxonomy-path.js
  function taxonomyPath(row) {
    return row.palanca + " \u203A " + row.subpalanca;
  }
  function taxonomySubLabel(value) {
    return String(value || "").split(" \u203A ").slice(1).join(" \u203A ") || String(value || "");
  }
  function taxonomyChoices(paths, selection = {}) {
    let rows = paths.map((value) => ({ value, palanca: value.split(" \u203A ")[0], subpalanca: taxonomySubLabel(value) }));
    return { palanca: [...new Set(rows.filter((row) => !selection.subpalanca || row.subpalanca === taxonomySubLabel(selection.subpalanca)).map((row) => row.palanca))], subpalanca: rows.filter((row) => !selection.palanca || row.palanca === selection.palanca).map((row) => row.value) };
  }
