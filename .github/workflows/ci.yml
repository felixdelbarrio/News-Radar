name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Integrity and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Historical benchmark baseline is verified by regression tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: make install check-dist verify preview
      - name: Upload Apps Script package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: news-radar-apps-script
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: news-radar-coverage
          path: |
            output/coverage/index.html
            output/coverage/**/*.html
            output/coverage/*.css
            output/coverage/*.js
            output/coverage/lcov.info
            output/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
